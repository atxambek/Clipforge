name: Extract ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o ClipForgeAI-v0.5.2-GitHub.zip -d extracted
          cp -a extracted/. .
          rm -rf extracted
          rm -f ClipForgeAI-v0.5.2-GitHub.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ClipForge AI project" || true
          git push
