name: Prepare ClipForge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move project
        run: |
          cp -a ClipForgeAI-v0.5.2-GitHub/. .
          rm -rf ClipForgeAI-v0.5.2-GitHub

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare ClipForge root" || true
          git pull --rebase origin main
          git push origin HEAD:main
