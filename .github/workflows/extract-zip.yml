name: Prepare ClipForge

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move project to root
        run: |
          cp -a ClipForgeAI-v0.5.2-GitHub/. .
          rm -rf ClipForgeAI-v0.5.2-GitHub

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Move project to repository root" || true
          git push
